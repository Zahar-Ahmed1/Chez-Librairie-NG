<!-- Navbar Ultra-Moderne avec Animations Avancées -->
<nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-700 ease-out"
     [class.navbar-scrolled]="isScrolled"
     [class.navbar-transparent]="!isScrolled">

  <!-- Barre de progression de scroll -->
  <div class="absolute bottom-0 left-0 h-1 bg-gradient-to-r from-primary via-secondary to-accent transition-all duration-300 ease-out"
       [style.width.%]="scrollProgress"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-20">

      <!-- Logo avec animations complexes -->
      <div class="flex-shrink-0 group cursor-pointer logo-animation">
        <a routerLink="/" class="flex items-center space-x-3 group-hover:scale-105 transition-all duration-500 ease-out">
          <!-- Icône animée avec morphing -->
          <div class="relative">
            <div class="w-12 h-12 bg-gradient-to-br from-primary via-blue-500 to-secondary rounded-2xl flex items-center justify-center shadow-2xl group-hover:shadow-primary/25 transition-all duration-500 group-hover:rotate-12">
              <svg class="w-7 h-7 text-white transition-transform duration-500 group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
              </svg>
            </div>
            <!-- Particules flottantes -->
            <div class="absolute -top-1 -right-1 w-3 h-3 bg-accent rounded-full animate-ping opacity-75"></div>
            <div class="absolute -bottom-1 -left-1 w-2 h-2 bg-secondary rounded-full animate-pulse"></div>
          </div>

          <!-- Texte avec effet de vague -->
          <div class="relative overflow-hidden">
            <span class="text-3xl font-black bg-gradient-to-r from-primary via-blue-600 to-secondary bg-clip-text text-transparent group-hover:animate-pulse">
              ChezLibrairie
            </span>
            <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -skew-x-12 transform translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-1000 ease-out"></div>
          </div>
        </a>
      </div>

      <!-- Menu Desktop avec effets de vague et morphing -->
      <div class="hidden lg:block">
        <div class="flex items-center space-x-2">
          <a routerLink="/"
             routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}"
             class="nav-item group relative px-6 py-3 rounded-2xl text-sm font-semibold transition-all duration-500 ease-out hover:scale-105">
            <span class="relative z-10 flex items-center space-x-2">
              <span class="text-lg">🏠</span>
              <span>Accueil</span>
            </span>
            <div class="absolute inset-0 bg-gradient-to-r from-primary/20 via-blue-500/20 to-secondary/20 rounded-2xl scale-0 group-hover:scale-100 transition-all duration-500 ease-out"></div>
            <div class="absolute inset-0 border-2 border-transparent group-hover:border-primary/30 rounded-2xl transition-all duration-500"></div>
          </a>


            <a routerLink="/about"
             routerLinkActive="active-link"
             class="nav-item group relative px-6 py-3 rounded-2xl text-sm font-semibold transition-all duration-500 ease-out hover:scale-105">
            <span class="relative z-10 flex items-center space-x-2">
              <span class="text-lg">ℹ️</span>
              <span>À propos</span>
            </span>
            <div class="absolute inset-0 bg-gradient-to-r from-accent/20 via-purple-500/20 to-primary/20 rounded-2xl scale-0 group-hover:scale-100 transition-all duration-500 ease-out"></div>
            <div class="absolute inset-0 border-2 border-transparent group-hover:border-accent/30 rounded-2xl transition-all duration-500"></div>
          </a>
          
          <a routerLink="/categories"
             routerLinkActive="active-link"
             class="nav-item group relative px-6 py-3 rounded-2xl text-sm font-semibold transition-all duration-500 ease-out hover:scale-105">
            <span class="relative z-10 flex items-center space-x-2">
              <span class="text-lg">📚</span>
              <span>Catégories</span>
            </span>
            <div class="absolute inset-0 bg-gradient-to-r from-secondary/20 via-green-500/20 to-accent/20 rounded-2xl scale-0 group-hover:scale-100 transition-all duration-500 ease-out"></div>
            <div class="absolute inset-0 border-2 border-transparent group-hover:border-secondary/30 rounded-2xl transition-all duration-500"></div>
          </a>

          <a routerLink="/products"
             routerLinkActive="active-link"
             class="nav-item group relative px-6 py-3 rounded-2xl text-sm font-semibold transition-all duration-500 ease-out hover:scale-105">
            <span class="relative z-10 flex items-center space-x-2">
              <span class="text-lg">🛍️</span>
              <span>Produits</span>
            </span>
            <div class="absolute inset-0 bg-gradient-to-r from-accent/20 via-yellow-500/20 to-primary/20 rounded-2xl scale-0 group-hover:scale-100 transition-all duration-500 ease-out"></div>
            <div class="absolute inset-0 border-2 border-transparent group-hover:border-accent/30 rounded-2xl transition-all duration-500"></div>
          </a>




          <a routerLink="/contact"
             routerLinkActive="active-link"
             class="nav-item group relative px-6 py-3 rounded-2xl text-sm font-semibold transition-all duration-500 ease-out hover:scale-105">
            <span class="relative z-10 flex items-center space-x-2">
              <span class="text-lg">📞</span>
              <span>Contact</span>
            </span>
            <div class="absolute inset-0 bg-gradient-to-r from-primary/20 via-purple-500/20 to-secondary/20 rounded-2xl scale-0 group-hover:scale-100 transition-all duration-500 ease-out"></div>
            <div class="absolute inset-0 border-2 border-transparent group-hover:border-primary/30 rounded-2xl transition-all duration-500"></div>
          </a>

        
        </div>
      </div>

      <!-- Actions avec animations avancées -->
      <div class="flex items-center space-x-4">
        <!-- Bouton de recherche avec effet de focus -->
        <div class="relative group">
          <button class="p-3 text-text hover:text-primary hover:bg-primary/10 rounded-2xl transition-all duration-500 hover:scale-110 hover:rotate-12 action-button">
            <svg class="w-6 h-6 transition-all duration-500 group-hover:scale-125" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </button>
          <!-- Tooltip -->
          <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 bg-text text-white text-xs px-3 py-1 rounded-lg opacity-0 group-hover:opacity-100 transition-all duration-300 pointer-events-none">
            Rechercher
          </div>
        </div>



        <!-- Menu Mobile avec animation de morphing -->
        <button class="lg:hidden relative p-3 text-text hover:text-primary hover:bg-primary/10 rounded-2xl transition-all duration-500 action-button group"
                (click)="toggleMobileMenu()"
                [class.rotate-180]="isMobileMenuOpen">
          <div class="relative w-6 h-6">
            <!-- Hamburger -->
            <span class="absolute top-1 left-0 w-6 h-0.5 bg-current transform transition-all duration-500"
                  [class.rotate-45]="isMobileMenuOpen"
                  [class.translate-y-2]="isMobileMenuOpen"></span>
            <span class="absolute top-3 left-0 w-6 h-0.5 bg-current transform transition-all duration-500"
                  [class.opacity-0]="isMobileMenuOpen"></span>
            <span class="absolute top-5 left-0 w-6 h-0.5 bg-current transform transition-all duration-500"
                  [class.-rotate-45]="isMobileMenuOpen"
                  [class.-translate-y-2]="isMobileMenuOpen"></span>
          </div>
          <!-- Tooltip -->
          <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 bg-text text-white text-xs px-3 py-1 rounded-lg opacity-0 group-hover:opacity-100 transition-all duration-300 pointer-events-none">
            Menu
          </div>
        </button>
      </div>
    </div>

    <!-- Menu Mobile avec animations de slide et fade -->
    <div class="lg:hidden overflow-hidden transition-all duration-700 ease-out"
         [class.max-h-0]="!isMobileMenuOpen"
         [class.max-h-screen]="isMobileMenuOpen">
      <div class="px-4 pt-6 pb-8 space-y-3 bg-white/95 backdrop-blur-xl rounded-b-3xl shadow-2xl border-t border-primary/20 mobile-menu-enter">
        <a routerLink="/"
           routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}"
           class="mobile-nav-item group flex items-center space-x-4 px-6 py-4 rounded-2xl text-base font-semibold transition-all duration-500 hover:bg-primary/10 hover:text-primary hover:translate-x-4 hover:scale-105">
          <span class="text-2xl group-hover:scale-125 transition-transform duration-300">🏠</span>
          <span>Accueil</span>
          <div class="ml-auto w-2 h-2 bg-primary rounded-full opacity-0 group-hover:opacity-100 transition-all duration-300"></div>
        </a>

        <a routerLink="/categories"
           routerLinkActive="active-link"
           class="mobile-nav-item group flex items-center space-x-4 px-6 py-4 rounded-2xl text-base font-semibold transition-all duration-500 hover:bg-secondary/10 hover:text-secondary hover:translate-x-4 hover:scale-105">
          <span class="text-2xl group-hover:scale-125 transition-transform duration-300">📚</span>
          <span>Catégories</span>
          <div class="ml-auto w-2 h-2 bg-secondary rounded-full opacity-0 group-hover:opacity-100 transition-all duration-300"></div>
        </a>

        <a routerLink="/products"
           routerLinkActive="active-link"
           class="mobile-nav-item group flex items-center space-x-4 px-6 py-4 rounded-2xl text-base font-semibold transition-all duration-500 hover:bg-accent/10 hover:text-accent hover:translate-x-4 hover:scale-105">
          <span class="text-2xl group-hover:scale-125 transition-transform duration-300">🛍️</span>
          <span>Produits</span>
          <div class="ml-auto w-2 h-2 bg-accent rounded-full opacity-0 group-hover:opacity-100 transition-all duration-300"></div>
        </a>

        <a routerLink="/contact"
           routerLinkActive="active-link"
           class="mobile-nav-item group flex items-center space-x-4 px-6 py-4 rounded-2xl text-base font-semibold transition-all duration-500 hover:bg-primary/10 hover:text-primary hover:translate-x-4 hover:scale-105">
          <span class="text-2xl group-hover:scale-125 transition-transform duration-300">📞</span>
          <span>Contact</span>
          <div class="ml-auto w-2 h-2 bg-primary rounded-full opacity-0 group-hover:opacity-100 transition-all duration-300"></div>
        </a>

        <a routerLink="/about"
           routerLinkActive="active-link"
           class="mobile-nav-item group flex items-center space-x-4 px-6 py-4 rounded-2xl text-base font-semibold transition-all duration-500 hover:bg-accent/10 hover:text-accent hover:translate-x-4 hover:scale-105">
          <span class="text-2xl group-hover:scale-125 transition-transform duration-300">ℹ️</span>
          <span>À propos</span>
          <div class="ml-auto w-2 h-2 bg-accent rounded-full opacity-0 group-hover:opacity-100 transition-all duration-300"></div>
        </a>
      </div>
    </div>
  </div>
</nav>
