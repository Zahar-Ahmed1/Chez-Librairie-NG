<section id="accueil" class="relative min-h-screen flex items-center justify-center overflow-hidden">
  <!-- Fond dégradé amélioré -->
  <div class="absolute inset-0 bg-gradient-to-br from-primary via-blue-600 to-secondary opacity-90"></div>

  <!-- Motifs décoratifs améliorés -->
  <div class="absolute inset-0 overflow-hidden">
    <!-- Cercles animés -->
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-accent rounded-full opacity-20 animate-pulse"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-white rounded-full opacity-10 animate-pulse" style="animation-delay: 2s;"></div>

    <!-- Nouvelles formes décoratives -->
    <div class="absolute top-1/4 left-10 w-20 h-20 bg-secondary rounded-full opacity-10 animate-pulse" style="animation-delay: 1.5s;"></div>
    <div class="absolute bottom-1/4 right-10 w-16 h-16 bg-primary rounded-full opacity-15 animate-pulse" style="animation-delay: 0.8s;"></div>

    <!-- Lignes décoratives -->
    <div class="absolute top-1/3 left-0 w-full h-px bg-gradient-to-r from-transparent via-white to-transparent opacity-20"></div>
    <div class="absolute bottom-1/3 left-0 w-full h-px bg-gradient-to-r from-transparent via-white to-transparent opacity-20"></div>
  </div>

  <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <div class="hero-content">
      <!-- Badge flottant -->
      <div class="inline-block glass px-4 py-2 rounded-full text-white text-sm font-medium mb-6 slide-in-left">
        <span class="flex items-center">
          <span class="w-2 h-2 bg-accent rounded-full mr-2 animate-pulse"></span>
          Nouvelle collection disponible
        </span>
      </div>

      <h1 class="text-4xl md:text-6xl lg:text-7xl font-bold mb-6 leading-tight">
        <span class="text-white">Fournitures</span>
        <span class="block gradient-text">Scolaires et Bureautiques</span>
      </h1>

      <p class="text-xl md:text-2xl text-white/90 mb-8 max-w-3xl mx-auto leading-relaxed slide-up delay-200">
        Tout ce dont vous avez besoin pour l'école, le bureau et au-delà.
        <span class="font-semibold">Qualité, prix et service au rendez-vous.</span>
      </p>

      <div class="flex flex-col sm:flex-row gap-4 justify-center items-center slide-up delay-300">
        <button class="bg-accent hover:bg-yellow-400 text-white font-semibold py-4 px-8 rounded-full text-lg transition-all duration-300 transform hover:scale-105 hover:shadow-xl relative overflow-hidden group">
          <span class="relative z-10">Découvrir nos produits</span>
          <span class="absolute inset-0 bg-white opacity-0 group-hover:opacity-20 transition-opacity duration-300"></span>
        </button>
        <button class="glass text-white font-semibold py-4 px-8 rounded-full text-lg transition-all duration-300 hover:bg-white/20">
          En savoir plus
        </button>
      </div>

      <!-- Statistiques -->
      <div class="mt-12 grid grid-cols-2 md:grid-cols-3 gap-4 text-white slide-up delay-400">
        <div class="glass p-4 rounded-xl">
          <div class="text-2xl font-bold">5000+</div>
          <div class="text-sm opacity-80">Produits</div>
        </div>
        <div class="glass p-4 rounded-xl">
          <div class="text-2xl font-bold">24h</div>
          <div class="text-sm opacity-80">Livraison</div>
        </div>
        <div class="glass p-4 rounded-xl hidden md:block">
          <div class="text-2xl font-bold">100%</div>
          <div class="text-sm opacity-80">Satisfaction</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Flèche vers le bas améliorée -->
  <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 glass p-3 rounded-full animate-bounce cursor-pointer">
    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
    </svg>
  </div>
</section>
